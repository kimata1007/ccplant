---
# Default values for agentapi-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# =============================================================================
# グローバル設定 (オプション)
# =============================================================================
# 親チャート（ccplant等）から渡されるグローバル設定を受け取ります。
# これらの設定は後方互換性のためオプションです。
# global設定が存在しない場合、各設定のローカル値がフォールバックとして使用されます。
#
# global:
#   # UIホスト名 (agentapi-ui用)
#   hostname: ""
#   # APIホスト名 (agentapi-proxy用)
#   apiHostname: ""
#
#   github:
#     enterprise:
#       enabled: false
#       baseUrl: ""
#     oauth:
#       clientId: ""
#       clientSecret: ""
#
#   ingress:
#     className: nginx
#     tls:
#       enabled: true

# API process settings. The API owns the public HTTP surface and application
# data only; it never receives Kubernetes workload credentials.
api:
  replicaCount: 1
  metrics:
    enabled: true
    port: 9090
  codexDeviceAuth:
    # Base URL used by remote Codex authentication workloads to report their
    # device challenge and result. Leave empty to derive it from the incoming
    # browser request. Set this when the browser-facing URL is not directly
    # reachable by the session manager (for example, behind an auth proxy).
    callbackBaseUrl: ""
  githubBroker:
    # Route session GitHub credentials directly to this release's API Service.
    # Enable only when sessions can reach the API's Kubernetes cluster network.
    # false preserves request-derived URLs (or a manually configured base URL).
    inCluster: false
  image:
    # The public API does not need agent CLIs or session tooling.
    # Use the full backend image only for legacy direct/local execution.
    repository: ghcr.io/ccplant/ccplant-api
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    # Enable this when the API must access Kubernetes directly while the
    # application KV backend is libSQL (for example, when running
    # `kv-store backfill-secret` inside the API Pod).
    automount: false
    annotations: {}
    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 999
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  # Names to omit from the API container after merging global and API env.
  # This is useful when another component needs generic AWS_* credentials but
  # the API must use credentials supplied through its own envFrom secret.
  envExclude: []
  envFrom: []
  # Optional static AWS credentials for API features such as KMS-backed KV
  # encryption. Prefer workload identity where the platform supports it.
  awsCredentials:
    accessKeyIdSecretRef:
      name: ""
      key: AWS_ACCESS_KEY_ID
    secretAccessKeySecretRef:
      name: ""
      key: AWS_SECRET_ACCESS_KEY
    sessionTokenSecretRef:
      name: ""
      key: AWS_SESSION_TOKEN
  # API application persistence. This is independent from the worker and
  # session-manager stores even when all three roles use the same libSQL
  # service and credentials.
  kvStore:
    namespace: default
    backend: libsql
    # Ephemeral single-replica default. Production deployments should use an
    # external libSQL URL through databaseUrlSecretRef.
    databaseUrl: file:///tmp/agentapi-api.db
    authToken: ""
    databaseUrlSecretRef:
      name: ""
      key: database-url
    authTokenSecretRef:
      name: ""
      key: auth-token
    primary:
      backend: ""
      databaseUrl: ""
      authToken: ""
      databaseUrlSecretRef:
        name: ""
        key: database-url
      authTokenSecretRef:
        name: ""
        key: auth-token
      encryption:
        provider: local
        activeKeyId: ""
        branchCacheTTLSeconds: 900
        branchCacheMaxEntries: 128
        kmsRegion: ""
        kmsRegionSecretRef:
          name: ""
          key: AGENTAPI_ENCRYPTION_KMS_REGION
        kmsKeys: {}
        kmsKeyIdSecretRef:
          name: ""
          key: AGENTAPI_ENCRYPTION_KMS_KEY_ID
        keysSecretRef:
          name: ""
          key: keys.json
    secondary:
      backend: ""
      databaseUrl: ""
      authToken: ""
      databaseUrlSecretRef:
        name: ""
        key: database-url
      authTokenSecretRef:
        name: ""
        key: auth-token
      encryption:
        provider: local
        activeKeyId: ""
        branchCacheTTLSeconds: 900
        branchCacheMaxEntries: 128
        kmsRegion: ""
        kmsRegionSecretRef:
          name: ""
          key: AGENTAPI_ENCRYPTION_KMS_REGION
        kmsKeys: {}
        kmsKeyIdSecretRef:
          name: ""
          key: AGENTAPI_ENCRYPTION_KMS_KEY_ID
        keysSecretRef:
          name: ""
          key: keys.json
    replication:
      mode: ""
  # Redis client settings used by the API for cross-pod state. The root redis
  # key only controls the optional bundled Redis workload.
  redis:
    addr: ""
    # For Cloud Run this names a Google Secret Manager secret. For Kubernetes
    # it names a Secret in the release namespace.
    existingSecret: ""
    existingSecretPasswordKey: redis-password
    db: 0
    tlsEnabled: false
    dialTimeout: "5s"
    readTimeout: "3s"
    writeTimeout: "3s"
    # Maximum concurrent short session-control Redis commands per API Pod.
    sessionControlPoolSize: 50
    # Maximum concurrent blocking XREAD calls per API Pod.
    sessionControlBlockingPoolSize: 400

  encryption:
    keySecretRef:
      name: ""
      key: encryption-key
  # Credential accepted by the API's worker-control endpoints. This is shared
  # with the worker only and must not be the session provisioner credential.
  workerControl:
    tokenSecretRef:
      name: ""
      key: token
    executionTokenSigningKeySecretRef:
      name: ""
      key: execution-token-signing-key
  # Authenticated API client used when session-manager is enabled.
  sessionManager:
    url: ""
    tokenSecretRef:
      name: ""
      key: token

# Optional Google Cloud Run output. The application configuration continues to
# come from this chart's existing api/config/github/scia
# values; this section contains only Cloud Run platform settings.
cloudRun:
  enabled: false
  service:
    name: ""
    project: ""
    region: ""
    serviceAccount: ""
  ingress: all
  scaling:
    minInstances: 0
    maxInstances: 3
  startupCpuBoost: true
  containerConcurrency: 80
  timeoutSeconds: 300
  # Cloud Run should route sessions through an outbound session-manager pool;
  # it cannot serve cluster-local session workload addresses itself.
  localSessionFallbackEnabled: false
  imageDigest: ""
  # Optional Secret Manager secret mounted as the application's auth config.
  # Keep environment-specific mappings in Secret Manager, not chart values.
  authConfigSecretRef:
    name: ""
    key: latest

# Deprecated API aliases retained for upgrades using older values files.
replicaCount: 1

# Opt in on the API and background worker together.
taskQueue:
  enabled: false

# Background controllers run in a dedicated process. Workload settings and
# controller settings intentionally live under this key rather than the proxy.
worker:
  enabled: false
  replicaCount: 1
  image:
    # Workers only need the ccplant binary and share the lightweight API image.
    repository: ghcr.io/ccplant/ccplant-api
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []

  # The worker only calls this authenticated control API; it never gets the
  # session-manager or session-provisioner credentials.
  controlApi:
    url: ""
    tokenSecretRef:
      name: ""
      key: token
    executionTokenSigningKeySecretRef:
      name: ""
      key: execution-token-signing-key
  # Normal session creation API used by scheduled jobs. Defaults to controlApi.url.
  sessionApi:
    url: ""

  # Deprecated compatibility fields. Application persistence is owned by the
  # API and the worker accesses it through controlApi.
  kvStore:
    namespace: default
    backend: libsql
    databaseUrl: ""
    authToken: ""
    databaseUrlSecretRef:
      name: ""
      key: database-url
    authTokenSecretRef:
      name: ""
      key: auth-token
    encryption:
      provider: local
      activeKeyId: ""
      branchCacheTTLSeconds: 900
      branchCacheMaxEntries: 128
      kmsRegion: ""
      kmsKeys: {}
      keysSecretRef:
        name: ""
        key: keys.json

  # Deprecated. Worker leader election is coordinated through controlApi, and
  # Redis is configured on api.redis.
  redis:
    addr: ""
    existingSecret: ""
    existingSecretPasswordKey: redis-password
    db: 0
    tlsEnabled: false
    dialTimeout: "5s"
    readTimeout: "3s"
    writeTimeout: "3s"
    sessionControlPoolSize: 50
    sessionControlBlockingPoolSize: 400

  # Default Slack Socket Mode connection. Tokens are injected by kubelet from
  # this Secret; the worker does not require Kubernetes API access.
  slack:
    baseUrl: ""
    tokenSecretRef:
      name: ""
      appTokenKey: app-token
      botTokenKey: bot-token
    dryRun: false

  schedule:
    enabled: false
    checkInterval: "30s"
    leaderElection:
      leaseDuration: "9m"
      renewDeadline: "6m"
      retryPeriod: "1m"

  slackbotCleanup:
    enabled: false
    sessionTTL: "72h"
    checkInterval: "1h"
    sessionTTLCheckInterval: "1m"
    dryRun: false
    leaderElection:
      leaseDuration: "9m"
      renewDeadline: "6m"
      retryPeriod: "1m"

# The forwarding session manager is an independent HTTP workload.
sessionManager:
  enabled: false
  metrics:
    enabled: true
    port: 9090
  # Roll the manager Deployment and future session Pods forward when its parent
  # proxy advertises a newer semantic version. Runner mode reads the version
  # from its authenticated heartbeat; standalone mode can poll versionUrl.
  autoUpgrade: true
  # Optional endpoint returning {"version":"vX.Y.Z"}. This allows an in-cluster
  # standalone manager to follow the API release without enabling runner mode.
  versionUrl: ""
  replicaCount: 1
  port: 8080
  # Public API used by the manager for outbound control commands. Leave empty
  # to use the in-cluster agentapi-proxy Service.
  apiUrl: ""
  image:
    repository: ghcr.io/ccplant/ccplant-api
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  # Optional registration with a parent/external control plane. A local
  # session-manager does not need any of these credentials.
  externalRegistration:
    enabled: false
    upstreamUrl: ""
    connectionTokenSecretRef:
      name: ""
      key: connection-token
    hmacSecretRef:
      name: ""
      key: hmac-secret
  # Cluster-wide runner mode. The manager owns idle runner inventory for this
  # logical pool; each runner claims work directly from the parent API.
  runner:
    enabled: false
    managerId: ""
    pool: ""
    upstreamUrl: ""
    connectionTokenSecretRef:
      name: ""
      key: connection-token
    # Optional dedicated secret for the HMAC-protected forwarding surface
    # (session lifecycle and codex device auth workload commands). Defaults to
    # the runner connection token, which the outbound control worker also uses
    # as its signing fallback.
    hmacSecretRef:
      name: ""
      key: ""
  # First-class runner/ESM registration for this chart's own built-in manager.
  # This single block configures both the API-side registry reconciliation and
  # the execution-plane manager process.
  builtin:
    enabled: false
    managerId: ""
    name: "Built-in session manager"
    connectionTokenSecretRef:
      name: ""
      key: connection-token
    hmacSecretRef:
      name: ""
      key: ""
    pool:
      name: ""
      labels: {}
      explicitOnly: false
      priority: -1
      binding:
        subjectType: all
        role: use
  # Credential accepted only by the session-manager internal API. The API
  # client references the same Secret independently under api.sessionManager.
  internalApi:
    tokenSecretRef:
      name: ""
      key: token
  # Standalone mode can read encrypted session settings itself. Remote modes
  # receive resolved settings from the parent API and do not use this key.
  encryption:
    keySecretRef:
      name: ""
      key: encryption-key
  allocation:
    leaseDuration: "15s"
    renewDeadline: "10s"
    retryPeriod: "2s"
  kvStore:
    # Used only by standalone mode. Remote/runner/builtin managers receive
    # resolved settings from the parent API and never connect to application KV.
    namespace: default
    backend: libsql
    databaseUrl: ""
    authToken: ""
    databaseUrlSecretRef:
      name: ""
      key: database-url
    authTokenSecretRef:
      name: ""
      key: auth-token
    encryption:
      provider: local
      activeKeyId: ""
      branchCacheTTLSeconds: 900
      branchCacheMaxEntries: 128
      kmsRegion: ""
      kmsKeys: {}
      keysSecretRef:
        name: ""
        key: keys.json
  redis:
    addr: ""
    existingSecret: ""
    existingSecretPasswordKey: redis-password
    db: 0
    tlsEnabled: false
    dialTimeout: "5s"
    readTimeout: "3s"
    writeTimeout: "3s"
    sessionControlPoolSize: 50
    sessionControlBlockingPoolSize: 400
  sessionPersistence:
    backend: ""
    suspendAfter: 1h
    s3:
      bucket: ""
      region: garage
      prefix: agentapi-sessions/
      endpoint: ""
      accessKeyIdSecretRef:
        name: ""
        key: access-key-id
      secretAccessKeySecretRef:
        name: ""
        key: secret-access-key
  # GitHub material copied into Session Pod Secrets. API OAuth/application
  # credentials remain independently configured at the root github key.
  # GitHub App settings and Enterprise URLs fall back to the root github key
  # for compatibility with deployments that predate the dedicated manager.
  github:
    token: ""
    tokenRef:
      name: ""
      key: github-token
    enterprise:
      enabled: false
      baseUrl: ""
      apiUrl: ""
    app:
      id: ""
      installationId: ""
      repositoryRestriction: false
      privateKey:
        secretName: ""
        key: private-key
  # Kubernetes workload allocation belongs exclusively to this process when
  # sessionManager.enabled=true. The deprecated root kubernetesSession values
  # are not consulted in that mode.
  kubernetesSession:
    enabled: true
    serviceAccountName: agentapi-proxy-session
    rbac:
      create: true
    image: "ghcr.io/ccplant/ccplant-agent:assets-8f5c4685e7ee739e600356c3e7b37900"
    # Source image for the ccplant binary injected into session Pods.
    # Empty follows the session-manager image.
    cliImage: ""
    networkFilterImage: "ghcr.io/takutakahashi/nfa:0.12.4"
    networkFilter:
      resources:
        requests: {cpu: "250m", memory: "256Mi"}
        limits: {cpu: "1000m", memory: "512Mi"}
      initResources:
        requests: {cpu: "50m", memory: "32Mi"}
        limits: {cpu: "100m", memory: "64Mi"}
    imagePullPolicy: IfNotPresent
    basePort: 9000
    resources:
      requests: {cpu: "500m", memory: "512Mi"}
      limits: {cpu: "2", memory: "4Gi"}
    executor:
      # Opt in to isolating model-generated shell commands in a sidecar.
      enabled: false
      resources:
        requests: {cpu: "10m", memory: "512Mi"}
        limits: {cpu: "2", memory: "4Gi"}
    pvc:
      enabled: false
      storageClass: ""
      storageSize: "10Gi"
    podStartTimeout: 120
    podStopTimeout: 30
    provisioner:
      proxyUrl: ""
      tokenSecretRef:
        name: ""
        key: provisioner-token
    nodeSelector: {}
    affinity: {}
    tolerations: []
    podTemplate: {}
    settingsBaseSecret: ""
    slackIntegration:
      botToken:
        secretName: ""
        key: bot-token
    otelCollector:
      enabled: false
      scrapeInterval: "15s"
      claudeCodeMetricsPort: 9464
      exporterPort: 9090
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 999
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
  livenessProbe:
    httpGet:
      path: /livez
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

image:
  repository: ghcr.io/ccplant/ccplant-backend
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # AWS IAM Role for S3 access (EKS + IRSA)
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT-ID:role/agentapi-s3-role
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Pod security context
# If not set, defaults to fsGroup: 999, runAsUser: 999, runAsGroup: 999
podSecurityContext: {}
# fsGroup: 999
# runAsUser: 999
# runAsGroup: 999

securityContext: {}

service:
  type: ClusterIP
  port: 8080

# Stable endpoint used by session provisioners to reach the active control plane.
# Keep this name independent from the Helm release so blue/green releases can
# switch the selector without recreating existing session workloads.
controlPlaneService:
  enabled: true
  create: true
  name: control
  port: 8080
  # Preserve the Service when its creating Helm release is uninstalled. A new
  # release should use create=false and may take over traffic by updating the
  # retained Service selector during cutover.
  retainOnDelete: true
  annotations: {}
  # Empty uses the current proxy Deployment selector. During cutover this may
  # be set to the selector of the new release.
  selector: {}

scia:
  # Deploy and configure scia Google OAuth broker/proxy integration.
  enabled: false
  image:
    repository: ghcr.io/takutakahashi/scia
    tag: "0.17.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  publicBaseUrl: ""
  oauthInternalUrl: ""
  proxyUrl: ""
  credential: ""
  todoistCredential: "default.todoist"
  userNamespace: ""
  dynamicUserSecretNamePrefix: scia-oauth-
  noProxy: "localhost,127.0.0.1,.svc,.cluster.local"
  googleHosts:
    - www.googleapis.com
    - tasks.googleapis.com
  googlePaths:
    - /calendar/v3/*
    - /tasks/v1/*
  todoistHosts:
    - api.todoist.com
  todoistPaths:
    - /api/v1/*
    - /rest/v2/*
    - /sync/v9/*
  sessionSidecar:
    enabled: true
    image: ghcr.io/takutakahashi/scia:0.17.0
    configImage: busybox:1.36
    port: 18081
  oauth:
    listen: "0.0.0.0:8081"
    redirectUrl: ""
    google:
      scope: "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks.readonly"
      name: Google
      setup: {}
      scopes:
        - id: calendar-read
          value: "https://www.googleapis.com/auth/calendar.readonly"
          name: "Google Calendar read-only"
          desc: "Read Google Calendar events."
          group: calendar
          groupName: "Google Calendar"
          groupDesc: "Choose how much Google Calendar access to grant."
          enabled: true
        - id: calendar-write
          value: "https://www.googleapis.com/auth/calendar"
          name: "Google Calendar read/write"
          desc: "Read and write Google Calendar events."
          group: calendar
          groupName: "Google Calendar"
          groupDesc: "Choose how much Google Calendar access to grant."
          enabled: false
        - id: tasks-read
          value: "https://www.googleapis.com/auth/tasks.readonly"
          name: "Google Tasks read-only"
          desc: "Read Google Tasks and task lists."
          group: tasks
          groupName: "Google Tasks"
          groupDesc: "Choose how much Google Tasks access to grant."
          enabled: true
        - id: tasks-write
          value: "https://www.googleapis.com/auth/tasks"
          name: "Google Tasks read/write"
          desc: "Read and write Google Tasks and task lists."
          group: tasks
          groupName: "Google Tasks"
          groupDesc: "Choose how much Google Tasks access to grant."
          enabled: false
      # Secret-backed Google OAuth client credentials. Set create=false and
      # existingSecret to use a Secret managed outside Helm.
      secret:
        create: false
        existingSecret: ""
        clientIdKey: client-id
        clientSecretKey: client-secret
        clientId: ""
        clientSecret: ""
    todoist:
      enabled: false
      scope: "data:read_write"
      name: Todoist
      iconUrl: "https://todoist.com/favicon.ico"
      description: "Connect Todoist tasks and projects."
      setup: {}
      scopes:
        - id: read-write
          value: "data:read_write"
          name: "Todoist read/write"
          desc: "Read and write Todoist tasks and projects."
          enabled: true
        - id: task-add
          value: "task:add"
          name: "Todoist task add"
          desc: "Add Todoist tasks without reading existing data."
          enabled: false
      omitRedirectUrl: false
      secret:
        create: true
        existingSecret: ""
        clientIdKey: client-id
        clientSecretKey: client-secret
        clientId: ""
        clientSecret: ""
  service:
    port: 8081
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  # When empty, global.apiHostname or config.hostname is used.
  hosts: []
  tls: []
  # - secretName: agentapi-proxy-tls
  #   hosts:
  #     - agentapi.example.com

# Create a more-specific Ingress for /internal so ingress-nginx can reject
# requests whose source address is not explicitly allowed. This is an
# additional network boundary; internal endpoint authentication still applies.
internalIngress:
  enabled: false
  # Empty inherits ingress.className (or global.ingress.className).
  className: ""
  path: /internal
  pathType: Prefix
  # Enabling this Ingress with an empty allowlist fails template rendering.
  allowedCIDRs: []
  annotations: {}
  # Configure paths per host. When empty, global.apiHostname (or
  # config.hostname) receives /internal, while global.hostname receives
  # /api/v1/internal and /api/proxy/internal. A string host entry remains
  # supported for backward compatibility and uses the top-level defaults.
  hosts: []
  # - host: api.example.com
  #   paths:
  #     - path: /internal
  #       pathType: Prefix
  # - host: example.com
  #   paths:
  #     - path: /api/v1/internal
  #       pathType: Prefix
  #     - path: /api/proxy/internal
  #       pathType: Prefix
  tls: []
  # - secretName: agentapi-proxy-tls
  #   hosts:
  #     - agentapi.example.com

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: 1

# GitHub configuration
github:
  # GitHub Personal Access Token (GitHub App を使わない場合)
  token: ""
  tokenRef:
    name: ""
    key: "github-token"

  # GitHub Enterprise Server を使用する場合は true に設定
  enterprise:
    enabled: false
    # GitHub Enterprise Server のベース URL
    # 例: https://github.company.com
    baseUrl: ""
    # GitHub Enterprise Server API の URL
    # 例: https://github.company.com/api/v3
    apiUrl: ""
  # GitHub App 認証設定
  app:
    # GitHub App ID (必須)
    # GitHub App設定画面の "App ID" に表示される数値
    id: ""
    # GitHub App Installation ID (必須)
    # 組織にインストール後のURLから取得: /settings/installations/12345678 -> 12345678
    installationId: ""
    # GitHub App installation token を対象リポジトリに限定する場合は true
    repositoryRestriction: false
    # GitHub App の秘密鍵（PEM形式）を含む Secret (必須)
    # kubectl create secret generic github-app-private-key --from-file=private-key=/path/to/app.private-key.pem
    privateKey:
      # Secret 名
      secretName: ""
      # Secret 内のキー名（通常は "private-key" のまま使用）
      key: "private-key"

# Application Configuration
config:
  # ホスト名設定 (例: agentapi.example.com)
  hostname: ""

  # Response-level token usage persistence. Credentials are supplied only via
  # an operator-managed Secret and are independent from kvStore.
  usage:
    enabled: false
    databaseUrlSecretRef:
      name: ""
      key: "database-url"
    authTokenSecretRef:
      name: ""
      key: "auth-token"

  # Session state transitions used to reconstruct usage by pool and principal.
  # The storage backend is selected independently from the application KV store.
  sessionCount:
    enabled: false
    backend: libsql
    databaseUrlSecretRef:
      name: ""
      key: "database-url"
    authTokenSecretRef:
      name: ""
      key: "auth-token"

  # 認証設定
  auth:
    # Single admin API key for the X-API-Key header. Prefer adminKeySecretRef
    # over adminKey so the credential is not stored in Helm release values.
    adminKey: ""
    adminKeySecretRef:
      name: ""
      key: "admin-key"
    # Break-glass administrator authentication. This works even when the admin
    # key, GitHub and other authentication providers are disabled. Prefer
    # tokenSecretRef over token so the credential is not stored in Helm release values.
    bootstrapAdmin:
      enabled: false
      userId: "bootstrap-admin"
      username: "admin"
      token: ""
      tokenSecretRef:
        name: ""
        key: "token"
    github:
      enabled: false
      baseUrl: "https://api.github.com"
      tokenHeader: "Authorization"
      oauth:
        clientId: ""
        clientSecret: ""
        clientSecretRef:
          name: ""
          key: "client-secret"
        scope: "read:user read:org project"
        baseUrl: ""
        # 許可するリダイレクトURI (カンマ区切りで複数指定可能)
        allowedRedirectUris: ""

  # Claude Code 設定
  claude:
    # Claude Code の起動引数 (例: "--dangerously-skip-permissions")
    args: ""

  # VAPID (Web Push 通知) 設定
  vapid:
    # VAPID 公開鍵 (Web Push 通知用)
    publicKey: ""
    # VAPID 秘密鍵 (Web Push 通知用)
    privateKey: ""
    privateKeyRef:
      name: ""
      key: "vapid-private-key"
    # VAPID 連絡先メールアドレス
    contactEmail: ""

  # 通知設定
  notification:
    # 通知ベースURL (例: https://example.com)
    # 末尾のスラッシュは含めない
    baseUrl: ""

  # Webhook 設定
  webhook:
    # Webhook URL のベースURL (例: https://example.com)
    # 設定しない場合はリクエストヘッダーから自動検出
    baseUrl: ""
    # GitHub Enterprise Server のデフォルトホスト名
    # webhook に enterprise_url が設定されていない場合、このホスト名でマッチング
    # 例: github.company.com (https:// なし)
    githubEnterpriseHost: ""

  # 暗号化設定
  encryption:
    # 暗号化キー (Base64エンコードされた32バイトの鍵)
    # 設定しない場合は暗号化なし (Noop) になります
    key: ""

# OpenTelemetry / Grafana Cloud Application Observability
observability:
  openTelemetry:
    enabled: false
    serviceName: agentapi-proxy
    workerServiceName: agentapi-worker
    sessionManagerServiceName: agentapi-session-manager
    serviceNamespace: ccplant
    deploymentEnvironment: ""
    # Region is added to every trace as cloud.region. Set this when the
    # platform does not expose FLY_REGION, CLOUD_RUN_REGION, or AWS_REGION.
    cloudRegion: ""
    tracesSampler: parentbased_traceidratio
    tracesSamplerArg: "1.0"
    # Existing Secret containing the OTLP base endpoint and authentication
    # headers. Create it separately; credentials are never stored in values.
    secretRef:
      name: ""
      endpointKey: OTEL_EXPORTER_OTLP_ENDPOINT
      headersKey: OTEL_EXPORTER_OTLP_HEADERS

# Additional environment variables
env: []
# - name: CCPLANT_BINARY_PATH
#   value: "/usr/local/bin/ccplant"
# - name: GITHUB_TOKEN
#   value: "your-token"
# - name: CLAUDE_ARGS
#   value: "--dangerously-skip-permissions"
# GitHub Enterprise Server を使用する場合の環境変数例
# - name: GITHUB_URL
#   value: "https://github.company.com"
# - name: GITHUB_API
#   value: "https://github.company.com/api/v3"

# Environment variables from ConfigMaps and Secrets
envFrom: []
# - configMapRef:
#     name: agentapi-config
# - secretRef:
#     name: agentapi-secrets

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Auth configuration (stored in ConfigMap and mounted to the container)
# This allows complex authorization rules that cannot be easily expressed as environment variables
authConfig:
# Example configuration structure:
# github:
#   user_mapping:
#     # Allow users who do not belong to any configured team to authenticate.
#     # They receive default_role and default_permissions. Defaults to false.
#     allow_users_without_team: false
#     default_role: "user"
#     default_permissions:
#       - "read"
#       - "session:create"
#       - "session:list"
#     team_role_mapping:
#       "myorg/admins":
#         role: "admin"
#         permissions:
#           - "*"
#       "myorg/developers":
#         role: "developer"
#         permissions:
#           - "read"
#           - "write"
#           - "execute"
#           - "session:create"
#           - "session:list"
#           - "session:delete"
#           - "session:access"
#       "myorg/viewers":
#         role: "viewer"
#         permissions:
#           - "read"
#           - "session:list"

# Role-based environment files configuration
# Map environment files to secrets - this creates the appropriate projected volume automatically
roleEnvFiles:
  # Configuration for role-based environment variables
  enabled: false
  path: "/etc/role-env-files"
  loadDefault: true

  # Simple mapping: filename -> secret configuration
  # ファイル名とSecretの設定を直接マッピング
  files:
    # "default.env":
    #   secretName: "agentapi-env-default"
    #   key: "default.env"
    # "admin.env":
    #   secretName: "agentapi-env-admin" 
    #   key: "admin.env"
    # "developer.env":
    #   secretName: "agentapi-env-developer"
    #   key: "developer.env"
    # "user.env":
    #   secretName: "agentapi-env-user"
    #   key: "user.env"
    # "guest.env":
    #   secretName: "agentapi-env-guest"
    #   key: "guest.env"
  
  # Example usage:
  # roleEnvFiles:
  #   enabled: true
  #   files:
  #     "default.env":
  #       secretName: "common-env-vars"
  #       key: "default.env"
  #     "admin.env":
  #       secretName: "admin-secrets"
  #       key: "admin-config"
  #     "developer.env":
  #       secretName: "dev-config"
  #       key: "development.env"

# Kubernetes Session Management
# Sessions are created as separate Kubernetes Deployments
kubernetesSession:
  # Creates the RBAC and ServiceAccount required by session workloads.
  enabled: false

  # A shadow release can share the existing session identity and RBAC by using
  # the same name with rbac.create=false.
  serviceAccountName: agentapi-proxy-session
  rbac:
    create: true

  # Container image for session pods
  # Independent asset image; use an immutable tag or digest.
  # Outside Helm the equivalent runtime override is AGENTAPI_K8S_SESSION_IMAGE.
  image: "ghcr.io/ccplant/ccplant-agent:assets-8f5c4685e7ee739e600356c3e7b37900"
  # CLI source follows the manager release; override for a custom registry.
  cliImage: ""

  # Container image for the network-filter sidecar and initContainer (sandbox feature)
  networkFilterImage: "ghcr.io/takutakahashi/nfa:0.12.4"

  # Resource configuration for the network-filter sidecar and initContainer (sandbox feature)
  networkFilter:
    # Resources for the network-filter forward proxy sidecar container
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
    # Resources for the network-filter-setup init container
    initResources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  # Image pull policy for session pods
  imagePullPolicy: "IfNotPresent"

  # Base port that agentapi listens on in session pods
  basePort: 9000

  # Resource requests and limits for session pods (Kubernetes standard format)
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Run model-generated bash commands in a separate container cgroup. The
  # agent container reaches it through a Unix socket shared only within the Pod.
  executor:
    # Opt in to isolating model-generated shell commands in a sidecar.
    enabled: false
    resources:
      requests:
        cpu: "10m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "4Gi"

  # PVC configuration for session workdir
  pvc:
    # Enable PersistentVolumeClaim for session pods workdir
    # When disabled, EmptyDir is used instead (data is not persisted across pod restarts)
    enabled: false
    # Storage class for session PVCs (empty for default)
    storageClass: ""
    # Storage size for session PVCs
    storageSize: "10Gi"

  # Timeout settings (in seconds)
  podStartTimeout: 120
  podStopTimeout: 30

  # Session Pods poll the proxy internal API for provisioning jobs.
  provisioner:
    proxyUrl: ""
    tokenSecretRef:
      name: ""
      key: provisioner-token

  # Node selector for session pods
  # Example:
  # nodeSelector:
  #   disktype: ssd
  #   kubernetes.io/arch: amd64
  nodeSelector: {}

  # Kubernetes affinity rules for session pods. Example soft preference:
  # affinity:
  #   nodeAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         preference:
  #           matchExpressions:
  #             - key: node-pool
  #               operator: In
  #               values: [agent]
  affinity: {}

  # Tolerations for session pods
  # Example:
  # tolerations:
  #   - key: "dedicated"
  #     operator: "Equal"
  #     value: "agent"
  #     effect: "NoSchedule"
  #   - key: "gpu"
  #     operator: "Exists"
  #     effect: "PreferNoSchedule"
  tolerations: []

  # Additional PodTemplateSpec fields to merge into every session pod.
  # This is rendered as a YAML file, mounted into the proxy pod, and applied
  # with Kubernetes strategic merge patch when each session workload is created.
  # The proxy preserves required session fields such as serviceAccountName,
  # restartPolicy, session labels, and the main agentapi container command/args.
  podTemplate: {}
  # metadata:
  #   annotations:
  #     example.com/template: "enabled"
  #   labels:
  #     workload-type: agent-session
  # spec:
  #   priorityClassName: agent-session
  #   imagePullSecrets:
  #     - name: ghcr-pull-secret
  #   volumes:
  #     - name: extra-config
  #       configMap:
  #         name: extra-config
  #   containers:
  #     - name: agentapi
  #       volumeMounts:
  #         - name: extra-config
  #           mountPath: /etc/extra-config
  #           readOnly: true

  # GitHub authentication for repository cloning in session pods
  # A Secret is automatically created when github.app.id and github.app.privateKey.secretName are set
  # The Secret will be used by the clone-repo init container

  # Single base Kubernetes Secret shared by all sessions.
  # agentapi-proxy reads this Secret before each session starts and merges it at the lowest
  # priority (base → team → user). It contains a single settings.json key in the agentapi
  # settings format, which covers all per-session configuration in one place:
  #   - env_vars:       arbitrary environment variables injected into every session
  #   - auth_mode:      "bedrock" or "oauth" (overridden by team/user settings)
  #   - bedrock:        AWS Bedrock credentials/model (auth_mode=bedrock)
  #   - mcp_servers:    MCP server configurations merged into ~/.claude.json (Claude) and ~/.codex/config.toml (Codex)
  #   - marketplaces:   Claude Code marketplace URLs
  #   - enabled_plugins: Claude Code plugins to enable
  #   - hooks:          Claude Code hooks
  #
  # Secret naming conventions for team/user overrides:
  #   - Team settings: agentapi-settings-{team-name}
  #   - User settings: agentapi-settings-{user-id}
  #
  # Example base Secret:
  #   apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: agentapi-settings-base
  #   stringData:
  #     settings.json: |
  #       {
  #         "auth_mode": "bedrock",
  #         "bedrock": {"model": "anthropic.claude-3-5-sonnet-20241022-v2:0"},
  #         "mcp_servers": {
  #           "github": {"type": "http", "url": "https://mcp-github.example.com"}
  #         },
  #         "marketplaces": {"myorg": {"url": "https://github.com/myorg/marketplace"}},
  #         "enabled_plugins": ["my-plugin@myorg"],
  #         "env_vars": {"MY_GLOBAL_VAR": "value"}
  #       }
  settingsBaseSecret: ""
  # Legacy organization-wide MCP Secret. The API mounts this optional Secret
  # read-only and backfills it into libSQL during startup.
  mcpServersBaseSecret: "mcp-servers-base"

  # Slack Integration
  # claude-posts runs as a subprocess inside the agentapi container (not as a sidecar).
  # ACP agent types produce the history file used for Slack forwarding.
  slackIntegration:
    # Kubernetes Secret containing the Slack bot token.
    # The Secret must exist in the same namespace as the session pods.
    # Create it with:
    #   kubectl create secret generic slack-credentials \
    #     --from-literal=bot-token=xoxb-...
    botToken:
      # Secret name (required to enable Slack integration)
      secretName: ""
      # Key within the Secret that contains the bot token
      # Defaults to "bot-token"
      key: "bot-token"

  # OpenTelemetry Collector Configuration
  # Enables Prometheus metrics collection from Claude Code in session pods.
  # otelcol always runs as an in-process subprocess inside the agentapi container,
  # started by the provisioner after user context is established. This ensures
  # metrics labels (user_id, session_id, etc.) are correct even with stock sessions.
  otelCollector:
    enabled: false

    # Scrape interval for Claude Code metrics
    scrapeInterval: "15s"

    # Claude Code metrics port (where OTEL_METRICS_EXPORTER=prometheus exposes metrics)
    claudeCodeMetricsPort: 9464

    # Exporter port (where otelcol exposes labeled metrics)
    exporterPort: 9090

# =============================================================================
# Redis – 複数Pod間のセッションステータス同期
# =============================================================================
# Redis はセッション制御とPod間のステータス同期に必須です。
#
# enabled=true のとき Bitnami Redis サブチャートが一緒にデプロイされます。
# 外部 Redis を使いたい場合は enabled=false にして externalRedis を設定してください。
redis:
  # enabled=true: Bitnami Redis サブチャートをデプロイする
  enabled: true

  # Bitnami Redis サブチャートの設定
  # https://github.com/bitnami/charts/tree/main/bitnami/redis
  architecture: standalone
  image:
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    enabled: false
    password: ""
  master:
    kind: Deployment
    persistence:
      enabled: false
      size: 1Gi
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Ephemeral libSQL Server for development trials only.
libsqlTrial:
  enabled: false
  image: ghcr.io/tursodatabase/libsql-server:3ec6803
  storageSize: 1Gi
